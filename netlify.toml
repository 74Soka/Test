# Déploiement sur Netlify.
# Les variables NEXT_PUBLIC_SUPABASE_URL et NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
# se renseignent dans Netlify (Project configuration > Environment variables),
# AVANT le déploiement : elles sont intégrées au moment de la construction.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Module Next.js de Netlify, déclaré explicitement (version fixée dans
# package.json) : sans lui, Netlify publie le dossier .next brut et toutes
# les pages répondent 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
