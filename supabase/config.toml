# Configuration de Supabase en local (`npx supabase start`, nécessite Docker).
# Sur le projet hébergé, réglez l'équivalent dans le tableau de bord (voir README).
project_id = "paniers"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
# Pas d'inscription libre : les comptes sont créés par l'administrateur.
enable_signup = false
