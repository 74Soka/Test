<h2>Nouveau mot de passe</h2>
<p>Vous avez demandé à changer votre mot de passe. Choisissez-en un nouveau :</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirmer?token_hash={{ .TokenHash }}&type=recovery&suite=/nouveau-mot-de-passe"
     style="display:inline-block;padding:12px 20px;background:#15803d;color:#ffffff;border-radius:10px;text-decoration:none;font-weight:bold">
    Choisir un nouveau mot de passe
  </a>
</p>
<p>Si vous n'avez rien demandé, ignorez ce message : votre mot de passe ne change pas.</p>
